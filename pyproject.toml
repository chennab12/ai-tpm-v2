[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tpm-v2"
version = "0.1.0"
description = "AI TPM Benchmarking & GPU Readiness Analysis Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "psutil>=5.9.0",
    "mlflow>=2.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
ai-tpm = "src.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
